<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sabbir's Sponsorship Tracker</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>  
    <h1>
        UK Cloud Job Hunt - Sponsorship Tracker
    </h1>
    <p>
        Hi, I'm Sabbir. I'm tracking my UK cloud job search publicly so that other international students can see what works and what doesn't.
    </p>

    <h2>
        Applications
    </h2>
    <p>
        Coming Soon!
    </p>

    <h2>
        Certifications
    </h2>
    <p>
        Coming Soon!
    </p>

    <footer>
        <p>
        Visitors: <span id="visitor-count">…</span></p>
        <p>
        Built on AWS - S3, CloudFront, Lambda, DynamoDB.
        </p>
    </footer>

    <script>
  fetch('https://730gg9guw8.execute-api.eu-west-2.amazonaws.com/visit')
    .then(response => response.json())
    .then(data => {
      document.getElementById('visitor-count').textContent = data.count;
    })
    .catch(error => {
      document.getElementById('visitor-count').textContent = '—';
      console.error('Counter failed:', error);
    });
</script>
</body>  
</html>
